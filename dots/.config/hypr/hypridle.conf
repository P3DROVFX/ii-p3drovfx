$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    # `lock sleep` locks with an instant opaque shade (no animation can race the
    # suspend, so the frame left on the panel never shows the desktop) and stops
    # the lockscreen's fingerprint prompt in the same call: some fingerprint
    # drivers (e.g. egismoc) crash fprintd if the system sleeps with a verify in
    # flight. `qs ipc call` blocks until the shell has handled it, unlike a
    # dispatch, and the shell kills its PAM subprocess outright, so fprintd has
    # released the reader by the time this returns. after_sleep_cmd's lockFocus
    # fades the shade out and re-focuses the prompt. Falls back to a plain
    # logind lock if the shell isn't running.
    before_sleep_cmd = qs ipc -c ii call lock sleep || loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

listener {
    timeout = 120 # 2mins
    on-timeout = bash -c 'brightnessctl -s set $(( $(brightnessctl get) / 2 ))'
    on-resume = brightnessctl -r
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
