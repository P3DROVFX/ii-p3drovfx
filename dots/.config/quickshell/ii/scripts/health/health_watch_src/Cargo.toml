[package]
name = "health_watch"
version = "0.1.0"
edition = "2021"
description = "System Health helper for the Quickshell ii shell: failed units, crashes, journal noise, drives, firmware and update chores, as NDJSON."

[dependencies]
# Pure-Rust D-Bus, blocking API only: systemd, UDisks2, fwupd and timedate1.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# The flag type `Proxy::call_with_flags` takes, for polkit's interactive prompt.
enumflags2 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
