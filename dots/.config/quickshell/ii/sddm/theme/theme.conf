# Defaults, used until the shell has synced once.
# The sync service writes theme.conf.user (a link into /var/lib/ii-sddm) with the
# live values; any key there wins over the same key here.
[General]
wallpaper=
font_main=
font_numbers=
font_expressive=
font_icons=
family_main=Google Sans Flex
family_numbers=Google Sans Flex
family_expressive=Space Grotesk
family_icons=Material Symbols Rounded
roundness_full=true
rounding_value=28
sharp_mode=false
anim_multiplier=1
transparency=false
extra_background_tint=true
material_shape_chars=true

blur_enable=true
blur_radius=45
desaturate_enable=true
desaturate_amount=0.25
colorwash_enable=false
colorwash_amount=0.5
vignette_enable=true
vignette_amount=0.3

# Quoted: QSettings would otherwise read a comma as a list separator.
islands_left="battery,capsLock,keyboardLayout"
islands_right="sleep,power,reboot"
islands_hidden=

clock_style=none
clock_time_format=hh:mm
clock_date_format="MM/dd, ddd"

color_background=#141313
color_on_background=#e6e1e1
color_surface_container_low=#1c1b1c
color_surface_container=#201f20
color_surface_container_high=#2b2a2a
color_surface_container_highest=#363435
color_on_surface=#e6e1e1
color_surface_variant=#49464a
color_on_surface_variant=#cbc5ca
color_outline=#948f94
color_shadow=#000000
color_primary=#cbc4cb
color_on_primary=#322f34
color_secondary=#cac5c8
color_secondary_container=#4d4b4d
color_on_secondary_container=#ece6e9
color_error=#ffb4ab
color_on_error=#690005
